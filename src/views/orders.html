<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:40px;
        }

        h1{
            color:#333;
        }

        table{

            width:100%;
            border-collapse:collapse;
            background:white;

        }

        th,td{

            padding:12px;
            border:1px solid #ddd;
            text-align:left;

        }

        th{

            background:#0077cc;
            color:white;

        }

        tr:nth-child(even){

            background:#f8f8f8;

        }

    </style>

</head>

<body>

<h1>My Orders</h1>

<p>
This page retrieves your username from the database and then fetches your orders.
</p>

<table>

    <thead>

    <tr>

        <th>ID</th>
        <th>Owner</th>
        <th>Product</th>
        <th>Amount</th>

    </tr>

    </thead>

    <tbody id="ordersTable">

    </tbody>

</table>

<script>

const params = new URLSearchParams(window.location.search);

const userId = params.get("id");

fetch(`/orders/${userId}`)

.then(res => res.json())

.then(data=>{

    const table=document.getElementById("ordersTable");

    data.forEach(order=>{

        table.innerHTML += `

        <tr>

            <td>${order.id}</td>
            <td>${order.owner}</td>
            <td>${order.product}</td>
            <td>$${order.amount}</td>

        </tr>

        `;

    });

});

</script>

</body>
</html>
